<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>शुभ दीपावली | Ultra Cinematic Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rozha+One&family=Yatra+One&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020005;
  font-family: 'Cinzel Decorative', serif;
  color: #fff;
}

canvas#world {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

.vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  background: radial-gradient(circle at 50% 50%, transparent 28%, rgba(2, 0, 8, 0.78) 75%, #010003 100%);
}

.rays {
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 170, 0, 0.04) 0deg 15deg, transparent 15deg 30deg);
  animation: spinRays 45s linear infinite;
  z-index: 2;
  pointer-events: none;
  mix-blend-mode: screen;
}
@keyframes spinRays { 100% { transform: rotate(360deg); } }

.stage {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
  pointer-events: none;
  text-align: center;
  padding: 0 20px;
}

.studio-tag {
  font-size: clamp(11px, 2.2vw, 15px);
  letter-spacing: 0.8em;
  color: #ffd97d;
  text-transform: uppercase;
  margin-bottom: 12px;
  text-shadow: 0 0 15px rgba(255, 180, 50, 0.9), 0 0 35px rgba(255, 110, 0, 0.7);
  opacity: 0;
  animation: dropIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
}

.main-title {
  font-family: 'Yatra One', cursive;
  font-size: clamp(54px, 14vw, 125px);
  line-height: 1.05;
  background: linear-gradient(180deg, #ffffff 0%, #fff1b8 25%, #f5af19 60%, #e65c00 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 35px rgba(255, 140, 0, 0.85)) drop-shadow(0 0 85px rgba(255, 60, 0, 0.65));
  opacity: 0;
  transform: scale(0.7) translateY(30px);
  animation: megaZoom 2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards, breathingGlow 4s ease-in-out infinite 2.6s;
}

.sub-title {
  font-family: 'Cinzel Decorative', serif;
  font-weight: 900;
  font-size: clamp(22px, 5vw, 48px);
  color: #ffe6a3;
  letter-spacing: 0.25em;
  margin-top: 8px;
  text-shadow: 0 0 25px rgba(255, 200, 80, 0.9);
  opacity: 0;
  animation: riseUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
}

.message-box {
  margin-top: 18px;
  max-width: 650px;
  font-family: 'Rozha One', serif;
  font-size: clamp(14px, 2.6vw, 19px);
  color: #f7e7c4;
  line-height: 1.7;
  letter-spacing: 0.04em;
  opacity: 0;
  animation: fadeIn 2s ease 1.6s forwards;
  text-shadow: 0 3px 12px rgba(0, 0, 0, 0.95), 0 0 20px rgba(255, 140, 0, 0.5);
}

/* स्क्रीन पर सिर्फ लिखा रहेगा */
.tap-banner {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  pointer-events: none;
  background: rgba(18, 5, 28, 0.75);
  border: 1px solid rgba(255, 200, 60, 0.6);
  padding: 10px 24px;
  border-radius: 999px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 30px rgba(255, 140, 0, 0.5), inset 0 0 15px rgba(255, 215, 0, 0.3);
  font-family: 'Rozha One', serif;
  font-size: clamp(15px, 3.4vw, 21px);
  color: #ffe999;
  letter-spacing: 0.08em;
  text-align: center;
  white-space: nowrap;
  animation: tapPulse 1.8s ease-in-out infinite alternate;
}
@keyframes tapPulse {
  0% { transform: translateX(-50%) scale(0.97); box-shadow: 0 0 20px rgba(255, 140, 0, 0.4); }
  100% { transform: translateX(-50%) scale(1.05); box-shadow: 0 0 45px rgba(255, 200, 0, 0.85); border-color: #fff; }
}

.diya-container {
  position: fixed;
  bottom: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 12;
  pointer-events: none;
}
.flame {
  width: 22px;
  height: 44px;
  background: radial-gradient(ellipse at 50% 80%, #ffffff 0%, #ffe066 30%, #ff6600 75%, transparent 100%);
  border-radius: 50% 50% 35% 35% / 60% 60% 40% 40%;
  filter: drop-shadow(0 0 22px #ff9900) drop-shadow(0 0 50px #ff4400);
  animation: flicker 0.15s ease-in-out infinite alternate;
  transform-origin: bottom center;
}
.diya-base {
  width: 68px;
  height: 22px;
  background: linear-gradient(180deg, #994d00, #4d1a00);
  border-radius: 0 0 50px 50px;
  box-shadow: 0 5px 25px rgba(255, 140, 0, 0.6), inset 0 2px 5px #ffb366;
  margin-top: -6px;
}

.sound-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 1px solid rgba(255, 215, 100, 0.5);
  background: rgba(18, 6, 28, 0.7);
  backdrop-filter: blur(14px);
  color: #ffca60;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 100;
  box-shadow: 0 0 30px rgba(255, 150, 0, 0.4);
}

@keyframes dropIn { to { opacity: 1; transform: translateY(0); } }
@keyframes riseUp { to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { to { opacity: 1; } }
@keyframes megaZoom {
  0% { opacity: 0; transform: scale(0.6) translateY(50px); filter: blur(15px); }
  100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
}
@keyframes breathingGlow {
  0%, 100% { filter: drop-shadow(0 0 35px rgba(255, 140, 0, 0.85)) drop-shadow(0 0 85px rgba(255, 60, 0, 0.65)); }
  50% { filter: drop-shadow(0 0 55px rgba(255, 200, 60, 1)) drop-shadow(0 0 130px rgba(255, 90, 0, 0.9)); }
}
@keyframes flicker {
  0% { transform: scale(1) rotate(-2deg) skewX(-2deg); }
  100% { transform: scale(1.08, 0.94) rotate(2deg) skewX(2deg); }
}
</style>
</head>
<body>

<canvas id="world"></canvas>
<div class="rays"></div>
<div class="vignette"></div>

<div class="stage">
  <div class="studio-tag">ZENIX STUDIO • CINEMATIC EXPERIENCE</div>
  <h1 class="main-title">शुभ दीपावली</h1>
  <div class="sub-title">HAPPY DIWALI</div>
  <p class="message-box">
    दीपों का यह पावन पर्व आपके जीवन को सुख, समृद्धि, वैभव और अनंत खुशियों की जगमगाती रोशनी से आलोकित कर दे।
  </p>
</div>

<div class="tap-banner">स्क्रीन पर 10 बार टैप करो 💥</div>

<div class="diya-container">
  <div class="flame"></div>
  <div class="diya-base"></div>
</div>

<button class="sound-toggle" id="sndBtn" aria-label="Toggle Sound">🔊</button>

<script>
// ==================== ख़तरनाक लाउड साउंड इंजन (Real Cracker Synthesizer) ====================
let audioCtx = null;
let masterGain, boomGain;
let muted = false;

function setupAudio() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext();

  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  masterGain.connect(audioCtx.destination);

  boomGain = audioCtx.createGain();
  boomGain.gain.setValueAtTime(1.4, audioCtx.currentTime);

  const compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.setValueAtTime(-14, audioCtx.currentTime);
  compressor.knee.setValueAtTime(10, audioCtx.currentTime);
  compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
  compressor.attack.setValueAtTime(0, audioCtx.currentTime);
  compressor.release.setValueAtTime(0.2, audioCtx.currentTime);

  boomGain.connect(compressor);
  compressor.connect(audioCtx.destination);

  // डीप तानपुरा ड्रोन
  [55.00, 110.00, 164.81].forEach((freq, idx) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = idx === 0 ? 'sine' : 'sawtooth';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(260, audioCtx.currentTime);

    g.gain.setValueAtTime(idx === 0 ? 0.08 : 0.02, audioCtx.currentTime);
    osc.connect(f);
    f.connect(g);
    g.connect(masterGain);
    osc.start();
  });

  // उत्सव धुन (चाइम्स)
  const festiveChimes = [293.66, 329.63, 440.00, 493.88, 587.33, 659.25, 880.00];
  let nIdx = 0;
  setInterval(() => {
    if (muted || !audioCtx || audioCtx.state !== 'running') return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(festiveChimes[nIdx % festiveChimes.length], t);
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.14, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(t);
    osc.stop(t + 1.65);
    nIdx = (nIdx + 1) % festiveChimes.length;
  }, 440);
}

// 💥 1000 वाली लड़ी का करारा धमाका
function triggerRealBombSound(power = 1.2) {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;

  // 1. शार्प स्नैप/क्रैक
  const snapBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.04, audioCtx.sampleRate);
  const snapDat = snapBuf.getChannelData(0);
  for (let i = 0; i < snapBuf.length; i++) snapDat[i] = (Math.random() * 2 - 1) * Math.exp(-i / 80);
  const snapSrc = audioCtx.createBufferSource();
  snapSrc.buffer = snapBuf;
  const snapGain = audioCtx.createGain();
  snapGain.gain.setValueAtTime(2.2 * power, t);
  snapSrc.connect(snapGain);
  snapGain.connect(boomGain);
  snapSrc.start(t);

  // 2. सब-बास थम्प (75Hz -> 20Hz)
  const subOsc = audioCtx.createOscillator();
  const subG = audioCtx.createGain();
  subOsc.type = 'triangle';
  subOsc.frequency.setValueAtTime(95, t);
  subOsc.frequency.exponentialRampToValueAtTime(22, t + 0.55);
  subG.gain.setValueAtTime(1.8 * power, t);
  subG.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
  subOsc.connect(subG);
  subG.connect(boomGain);
  subOsc.start(t);
  subOsc.stop(t + 0.65);

  // 3. बारूद का बॉडी साउंड
  const dur = 1.2;
  const nBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const nDat = nBuf.getChannelData(0);
  for (let i = 0; i < nBuf.length; i++) {
    nDat[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.18));
  }
  const nSrc = audioCtx.createBufferSource();
  nSrc.buffer = nBuf;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(950, t);
  lp.frequency.exponentialRampToValueAtTime(55, t + dur);

  const nGain = audioCtx.createGain();
  nGain.gain.setValueAtTime(1.8 * power, t);
  nGain.gain.exponentialRampToValueAtTime(0.001, t + dur);

  nSrc.connect(lp);
  lp.connect(nGain);
  nGain.connect(boomGain);
  nSrc.start(t);

  // 4. चटाकेदार चटचटाहट
  const ladiBurst = Math.floor(Math.random() * 8 + 8);
  for (let c = 0; c < ladiBurst; c++) {
    const delay = Math.random() * 650 + 100;
    setTimeout(() => {
      if (!audioCtx || muted) return;
      const ct = audioCtx.currentTime;
      const cLen = audioCtx.sampleRate * 0.05;
      const cBuf = audioCtx.createBuffer(1, cLen, audioCtx.sampleRate);
      const cDat = cBuf.getChannelData(0);
      for (let j = 0; j < cLen; j++) cDat[j] = (Math.random() * 2 - 1) * Math.exp(-j / 120);
      const cSrc = audioCtx.createBufferSource();
      cSrc.buffer = cBuf;
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = Math.random() * 3800 + 1400;
      const cG = audioCtx.createGain();
      cG.gain.setValueAtTime((Math.random() * 0.8 + 0.4) * power, ct);
      cG.gain.exponentialRampToValueAtTime(0.01, ct + 0.045);
      cSrc.connect(bp);
      bp.connect(cG);
      cG.connect(boomGain);
      cSrc.start(ct);
    }, delay);
  }

  // फ़ोन वाइब्रेशन
  if (navigator.vibrate) {
    try { navigator.vibrate([70, 35, 90]); } catch (_) {}
  }
}

// रॉकेट सीटी
function playWhistleSound() {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(320, t);
  osc.frequency.exponentialRampToValueAtTime(2100, t + 0.55);

  const f = audioCtx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.setValueAtTime(1200, t);

  g.gain.setValueAtTime(0.01, t);
  g.gain.linearRampToValueAtTime(0.18, t + 0.18);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);

  osc.connect(f);
  f.connect(g);
  g.connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.6);
}

// ==================== अनलिमिटेड टैप फायरिंग (Unlimited Tap Burst) ====================
window.addEventListener('pointerdown', (e) => {
  if (!audioCtx) setupAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  // हर टैप पर 3-4 सुपर रॉकेट्स एक साथ लॉन्च होंगे
  const burstCount = Math.floor(Math.random() * 2 + 3);
  for (let k = 0; k < burstCount; k++) {
    setTimeout(() => {
      rockets.push(new Rocket(e.clientX + (Math.random() * 90 - 45), e.clientY + (Math.random() * 90 - 45)));
    }, k * 110);
  }
});

const sndBtn = document.getElementById('sndBtn');
sndBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!audioCtx) setupAudio();
  muted = !muted;
  sndBtn.innerText = muted ? '🔇' : '🔊';
  if (masterGain) masterGain.gain.setValueAtTime(muted ? 0 : 0.4, audioCtx.currentTime);
  if (boomGain) boomGain.gain.setValueAtTime(muted ? 0 : 1.4, audioCtx.currentTime);
});

// ==================== 60FPS GRAPHICS ENGINE ====================
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function handleResize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
}
window.addEventListener('resize', handleResize);
handleResize();

const rockets = [];
const particles = [];
const shockwaves = [];

class Shockwave {
  constructor(x, y, hue) {
    this.x = x;
    this.y = y;
    this.r = 8;
    this.maxR = Math.random() * 120 + 170;
    this.alpha = 1;
    this.hue = hue;
  }
  update() {
    this.r += (this.maxR - this.r) * 0.15;
    this.alpha -= 0.04;
    return this.alpha > 0;
  }
  draw() {
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${this.hue}, 100%, 82%, ${this.alpha})`;
    ctx.lineWidth = 4.5;
    ctx.stroke();
    ctx.restore();
  }
}

class Rocket {
  constructor(tx, ty) {
    this.x = tx ? tx + (Math.random() * 60 - 30) : W * 0.1 + Math.random() * W * 0.8;
    this.y = H + 20;
    this.tx = tx || (this.x + (Math.random() * 240 - 120));
    this.ty = ty || (H * 0.12 + Math.random() * (H * 0.38));
    this.vel = Math.random() * 3.5 + 13.5;
    const angle = Math.atan2(this.ty - this.y, this.tx - this.x);
    this.vx = Math.cos(angle) * this.vel;
    this.vy = Math.sin(angle) * this.vel;
    this.hue = Math.floor(Math.random() * 360);
    this.history = [];
    playWhistleSound();
  }
  update() {
    this.history.push({ x: this.x, y: this.y });
    if (this.history.length > 9) this.history.shift();
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.05;

    if (this.vy >= -1.2 || this.y <= this.ty) {
      explodeMega(this.x, this.y, this.hue);
      return false;
    }
    return true;
  }
  draw() {
    ctx.save();
    ctx.lineWidth = 3.5;
    for (let i = 0; i < this.history.length - 1; i++) {
      const p1 = this.history[i];
      const p2 = this.history[i + 1];
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = `hsla(${this.hue}, 100%, 75%, ${i / this.history.length})`;
      ctx.stroke();
    }
    ctx.restore();
  }
}

class HeavyParticle {
  constructor(x, y, hue, angle, speed, isWillow = false) {
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.hue = hue + (Math.random() * 30 - 15);
    this.alpha = 1;
    this.isWillow = isWillow;
    this.decay = isWillow ? Math.random() * 0.009 + 0.007 : Math.random() * 0.02 + 0.015;
    this.friction = isWillow ? 0.96 : 0.94;
    this.gravity = isWillow ? 0.18 : 0.12;
    this.trail = [];
  }
  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > (this.isWillow ? 7 : 3)) this.trail.shift();
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
    return this.alpha > 0;
  }
  draw() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.alpha * (i / this.trail.length)})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.isWillow ? 2.2 : 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = `hsla(${this.hue}, 100%, 85%, ${this.alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.isWillow ? 3.0 : 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function explodeMega(x, y, hue) {
  triggerRealBombSound(1.35);
  shockwaves.push(new Shockwave(x, y, hue));

  const total = Math.floor(Math.random() * 60 + 120);
  const isWillowType = Math.random() > 0.35;

  for (let i = 0; i < total; i++) {
    const angle = (Math.PI * 2 / total) * i + (Math.random() * 0.2);
    const speed = isWillowType ? (Math.random() * 9.5 + 2) : (Math.random() * 11.5 + 1.5);
    particles.push(new HeavyParticle(x, y, hue, angle, speed, isWillowType));
  }

  for (let g = 0; g < 45; g++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5.5 + 0.5;
    particles.push(new HeavyParticle(x, y, 45, angle, speed, false));
  }
}

const embers = Array.from({ length: 65 }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  r: Math.random() * 1.8 + 0.6,
  alpha: Math.random() * 0.8 + 0.2,
  speedY: Math.random() * 0.7 + 0.3,
  speedX: Math.random() * 0.5 - 0.25
}));

let timer = 0;
function animate() {
  requestAnimationFrame(animate);

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(2, 0, 7, 0.25)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.fillStyle = '#ffd978';
  for (const eb of embers) {
    eb.y -= eb.speedY;
    eb.x += eb.speedX;
    if (eb.y < -10) eb.y = H + 10;
    if (eb.x < -10) eb.x = W + 10;
    if (eb.x > W + 10) eb.x = -10;
    ctx.globalAlpha = eb.alpha;
    ctx.beginPath();
    ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // बैकग्राउंड में अपने आप भी पटाखे फूटते रहेंगे
  timer++;
  if (timer % 40 === 0) {
    rockets.push(new Rocket());
  }

  for (let i = rockets.length - 1; i >= 0; i--) {
    if (!rockets[i].update()) rockets.splice(i, 1);
    else rockets[i].draw();
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    if (!shockwaves[i].update()) shockwaves.splice(i, 1);
    else shockwaves[i].draw();
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    if (!particles[i].update()) particles.splice(i, 1);
    else particles[i].draw();
  }
}

animate();
</script>
</body>
</html>
