<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>शुभ दीपावली | Happy Diwali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Rozha+One&family=Yatra+One&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #030108;
  font-family: 'Cinzel', serif;
  color: #fff;
}
canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  display: block;
}
.cinematic-vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background: radial-gradient(circle at center, transparent 40%, rgba(2, 1, 6, 0.75) 85%, #000 100%);
}
.lens-flare {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 6;
  mix-blend-mode: screen;
  background: radial-gradient(ellipse at 50% 20%, rgba(255, 170, 50, 0.12), transparent 60%);
}

/* Glassmorphism Title Overlay */
.hero-wrapper {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
  pointer-events: none;
  text-align: center;
  padding: 0 16px;
}
.brand-badge {
  font-size: clamp(10px, 2vw, 13px);
  letter-spacing: 0.6em;
  text-transform: uppercase;
  color: #ffd978;
  margin-bottom: 12px;
  opacity: 0;
  transform: translateY(-20px);
  animation: smoothDrop 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
  text-shadow: 0 0 12px rgba(255, 180, 50, 0.8);
}
.main-title {
  font-family: 'Yatra One', cursive;
  font-size: clamp(48px, 12vw, 110px);
  line-height: 1.1;
  background: linear-gradient(180deg, #ffffff 0%, #ffeaa7 35%, #e1981a 75%, #8c4c00 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 30px rgba(255, 150, 0, 0.6)) drop-shadow(0 0 70px rgba(255, 90, 0, 0.4));
  opacity: 0;
  transform: scale(0.85);
  animation: epicZoom 2s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
}
.sub-title {
  font-family: 'Rozha One', serif;
  font-size: clamp(20px, 4.5vw, 42px);
  color: #ffd580;
  letter-spacing: 0.15em;
  margin-top: 8px;
  opacity: 0;
  transform: translateY(20px);
  animation: smoothRise 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
  text-shadow: 0 0 20px rgba(255, 180, 50, 0.9);
}
.wishes-quote {
  font-size: clamp(13px, 2.5vw, 17px);
  color: #e0d0b0;
  max-width: 600px;
  line-height: 1.8;
  margin-top: 24px;
  opacity: 0;
  animation: fadeIn 2s ease 2s forwards;
  letter-spacing: 0.05em;
  text-shadow: 0 2px 10px rgba(0,0,0,0.9);
}

/* Sound Controller */
.audio-ctrl {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(255, 215, 100, 0.4);
  background: rgba(15, 8, 2, 0.6);
  backdrop-filter: blur(10px);
  color: #ffca60;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 100;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 20px rgba(255, 140, 0, 0.3);
}
.audio-ctrl:hover {
  transform: scale(1.1);
  box-shadow: 0 0 30px rgba(255, 180, 0, 0.6);
  border-color: #ffe685;
}

@keyframes epicZoom {
  0% { opacity: 0; transform: scale(0.8) translateY(20px); filter: blur(10px); }
  100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
}
@keyframes smoothDrop { to { opacity: 0.9; transform: translateY(0); } }
@keyframes smoothRise { to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { to { opacity: 0.95; } }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div class="cinematic-vignette"></div>
<div class="lens-flare"></div>

<div class="hero-wrapper">
  <div class="brand-badge">ZENIX STUDIO PRESENTS</div>
  <h1 class="main-title">शुभ दीपावली</h1>
  <div class="sub-title">HAPPY DIWALI</div>
  <p class="wishes-quote">
    रोशनी, उमंग और खुशियों के इस पावन पर्व पर आपके जीवन में सुख, समृद्धि और नई सफलताएं जगमगाती रहें।
  </p>
</div>

<button class="audio-ctrl" id="soundBtn" aria-label="Toggle Sound">🔊</button>

<script>
// --- AUDIO ENGINE: Melodic Diwali Indian Ambient Synth ---
let audioCtx = null;
let isAudioActive = false;
let isMuted = false;
let masterGain, sfxGain;

function initAudio() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext();

  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
  masterGain.connect(audioCtx.destination);

  sfxGain = audioCtx.createGain();
  sfxGain.gain.setValueAtTime(0.65, audioCtx.currentTime);
  sfxGain.connect(audioCtx.destination);

  // Tanpura / Atmospheric Drone
  [146.83, 220.0, 293.66].forEach(freq => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(450, audioCtx.currentTime);

    g.gain.setValueAtTime(0.02, audioCtx.currentTime);
    osc.connect(f);
    f.connect(g);
    g.connect(masterGain);
    osc.start();
  });

  // Melodic Bells Sequencer (Bhairav / Festive Pentatonic Vibe)
  const notes = [
    293.66, 329.63, 369.99, 440.00, 493.88, 587.33,
    659.25, 739.99, 880.00, 659.25, 587.33, 440.00
  ];
  let step = 0;
  setInterval(() => {
    if (isMuted || !audioCtx || audioCtx.state !== 'running') return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const t = audioCtx.currentTime;

    osc.type = 'sine';
    osc.frequency.setValueAtTime(notes[step % notes.length], t);

    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);

    osc.connect(g);
    g.connect(masterGain);
    osc.start(t);
    osc.stop(t + 1.25);
    step++;
  }, 480);

  isAudioActive = true;
}

function playBoom(power = 1) {
  if (!audioCtx || isMuted) return;
  const t = audioCtx.currentTime;
  const dur = 1.1;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buf.getChannelData(0);

  for (let i = 0; i < buf.length; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.28));
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;

  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(320, t);
  f.frequency.exponentialRampToValueAtTime(40, t + dur);

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.8 * power, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);

  noise.connect(f);
  f.connect(g);
  g.connect(sfxGain);
  noise.start(t);
}

// Global user touch/click auto-starts sound naturally
window.addEventListener('pointerdown', () => {
  if (!audioCtx) initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: false });

const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!audioCtx) initAudio();
  isMuted = !isMuted;
  soundBtn.innerText = isMuted ? '🔇' : '🔊';
  if (masterGain) masterGain.gain.setValueAtTime(isMuted ? 0 : 0.35, audioCtx.currentTime);
  if (sfxGain) sfxGain.gain.setValueAtTime(isMuted ? 0 : 0.65, audioCtx.currentTime);
});

// --- ADVANCED 60FPS GRAPHICS & FIREWORK ENGINE ---
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

const rockets = [];
const particles = [];
const sparks = [];
const shockwaves = [];

class Shockwave {
  constructor(x, y, hue) {
    this.x = x;
    this.y = y;
    this.r = 4;
    this.maxR = Math.random() * 80 + 100;
    this.alpha = 1;
    this.hue = hue;
  }
  update() {
    this.r += (this.maxR - this.r) * 0.12;
    this.alpha -= 0.035;
    return this.alpha > 0;
  }
  draw() {
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${this.hue}, 100%, 75%, ${this.alpha})`;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }
}

class Rocket {
  constructor(targetX, targetY) {
    this.x = targetX ? targetX + (Math.random() * 40 - 20) : W * 0.15 + Math.random() * W * 0.7;
    this.y = H + 10;
    this.tx = targetX || (this.x + (Math.random() * 160 - 80));
    this.ty = targetY || (H * 0.12 + Math.random() * (H * 0.38));
    this.vel = Math.random() * 3 + 12;
    this.angle = Math.atan2(this.ty - this.y, this.tx - this.x);
    this.vx = Math.cos(this.angle) * this.vel;
    this.vy = Math.sin(this.angle) * this.vel;
    this.hue = Math.floor(Math.random() * 360);
    this.trail = [];
  }
  update() {
    this.trail.push({ x: this.x, y: this.y, alpha: 1 });
    if (this.trail.length > 7) this.trail.shift();

    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.04; // gravity

    if (this.vy >= -1.5 || this.y <= this.ty) {
      explode(this.x, this.y, this.hue);
      return false;
    }
    return true;
  }
  draw() {
    ctx.save();
    ctx.lineWidth = 2.5;
    for (let i = 0; i < this.trail.length - 1; i++) {
      const p1 = this.trail[i];
      const p2 = this.trail[i + 1];
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = `hsla(${this.hue}, 100%, 70%, ${i / this.trail.length})`;
      ctx.stroke();
    }
    ctx.restore();
  }
}

class Particle {
  constructor(x, y, hue, angle, speed, decay, type = 0) {
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.hue = hue + Math.floor(Math.random() * 40 - 20);
    this.alpha = 1;
    this.decay = decay;
    this.friction = 0.95;
    this.gravity = 0.16;
    this.type = type;
    this.flicker = Math.random() > 0.5;
  }
  update() {
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
    return this.alpha > 0;
  }
  draw() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const a = this.flicker && Math.random() < 0.3 ? this.alpha * 0.4 : this.alpha;
    ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${a})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.type === 1 ? 2.8 : 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function explode(x, y, hue) {
  playBoom(1);
  shockwaves.push(new Shockwave(x, y, hue));
  const count = Math.floor(Math.random() * 50 + 90);
  const ringType = Math.random() > 0.4;

  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + (ringType ? 0 : Math.random() * 0.2);
    const speed = ringType ? (Math.random() * 2 + 6.5) : (Math.random() * 8 + 1);
    const decay = Math.random() * 0.015 + 0.012;
    particles.push(new Particle(x, y, hue, angle, speed, decay, ringType ? 1 : 0));
  }

  // Glitter Sparks
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 0.5;
    particles.push(new Particle(x, y, 45, angle, speed, 0.035, 0));
  }
}

// User Click / Touch anywhere bursts a rocket directly
window.addEventListener('pointerdown', (e) => {
  rockets.push(new Rocket(e.clientX, e.clientY));
});

// Ambient Star Dust
const ambientDust = Array.from({ length: 45 }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  r: Math.random() * 1.5 + 0.5,
  alpha: Math.random(),
  speed: Math.random() * 0.25 + 0.1
}));

// Automatic Show Spawner
let autoTimer = 0;
function loop() {
  requestAnimationFrame(loop);

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(3, 1, 8, 0.22)'; // Motion blur trailing
  ctx.fillRect(0, 0, W, H);

  // Background dust
  ctx.save();
  ctx.fillStyle = '#ffd978';
  for (const d of ambientDust) {
    d.y -= d.speed;
    if (d.y < 0) d.y = H;
    d.alpha += (Math.random() * 0.04 - 0.02);
    d.alpha = Math.max(0.1, Math.min(0.8, d.alpha));
    ctx.globalAlpha = d.alpha;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Automatic bursts
  autoTimer++;
  if (autoTimer % 42 === 0) {
    rockets.push(new Rocket());
  }

  // Updates & Renders
  for (let i = rockets.length - 1; i >= 0; i--) {
    if (!rockets[i].update()) rockets.splice(i, 1);
    else rockets[i].draw();
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    if (!shockwaves[i].update()) shockwaves.splice(i, 1);
    else shockwaves[i].draw();
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    if (!particles[i].update()) particles.splice(i, 1);
    else particles[i].draw();
  }
}

loop();
</script>
</body>
</html>
