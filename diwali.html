<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>शुभ दीपावली</title>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#030208;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.sr{position:absolute;left:-9999px}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.8) 100%)}
.bar{position:fixed;left:0;right:0;height:0;background:#000;pointer-events:none;z-index:5;animation:bar 2s ease-out .2s forwards}
.bar.t{top:0}.bar.b{bottom:0}
@keyframes bar{to{height:7vh}}

.intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;animation:intro 3.2s ease-in-out .2s forwards;z-index:4}
.intro svg{width:84px;height:84px;filter:drop-shadow(0 0 14px rgba(255,170,60,.8))}
.brand{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(26px,6vw,54px);letter-spacing:.38em;margin-top:18px;
  padding-left:.38em;color:#ffd98a;text-shadow:0 0 22px rgba(255,140,40,.7)}
.pres{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.5em;padding-left:.5em;margin-top:10px;color:#a98a58}
@keyframes intro{0%{opacity:0;transform:scale(.94)}25%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.06)}}

.wish{position:fixed;left:0;right:0;top:41%;text-align:center;padding:0 7vw;pointer-events:none;z-index:3}
.wish p{font-family:'Hind',sans-serif;font-weight:500;font-size:clamp(17px,3.2vw,29px);margin:0 auto;max-width:21em;
  color:#fbeed6;line-height:1.7;text-shadow:0 0 16px #000,0 0 5px rgba(0,0,0,.95)}
.w{display:inline-block;margin:0 .13em;opacity:0;transform:translateY(30px) scale(1.2);filter:blur(12px);
  animation:wd 1.2s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d)}
@keyframes wd{to{opacity:1;transform:none;filter:blur(0)}}
.from{margin-top:22px;font-family:'Rozha One',serif;font-size:clamp(20px,3.6vw,34px);color:#ffd98a;opacity:0;
  text-shadow:0 0 18px rgba(255,140,40,.9);animation:fr 1.6s ease 20.2s forwards}
@keyframes fr{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.hint{position:fixed;left:0;right:0;bottom:calc(9vh + env(safe-area-inset-bottom,0px));text-align:center;z-index:3;
  font-family:'Hind',sans-serif;font-size:14px;color:#c9a46a;opacity:0;pointer-events:none;animation:hint 7s ease 12s forwards}
@keyframes hint{0%,100%{opacity:0}20%,80%{opacity:.85}}
@media (prefers-reduced-motion:reduce){.w,.from,.intro,.hint{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<h1 class="sr">शुभ दीपावली</h1>
<canvas id="c"></canvas>
<div class="vig"></div>
<div class="bar t"></div><div class="bar b"></div>

<div class="intro">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset="1" stop-color="#e0801c"/></linearGradient></defs>
    <path d="M50 4 96 50 50 96 4 50Z" fill="none" stroke="url(#g)" stroke-width="3"/>
    <path d="M30 32H70L34 68H70" fill="none" stroke="url(#g)" stroke-width="7" stroke-linejoin="miter"/>
  </svg>
  <div class="brand">ZENIX STUDIO</div>
  <div class="pres">presents</div>
</div>

<div class="wish">
  <p id="p" data-d="14.8" data-s=".09">मेरे सभी भाइयों को दीपावली की हार्दिक शुभकामनाएँ। आपकी ज़िंदगी दीयों की तरह जगमगाती रहे, और ख़ुशियाँ व कामयाबी हमेशा आपके साथ रहें।</p>
  <div class="from">✦ &nbsp;हमारी ओर से&nbsp; ✦</div>
</div>
<div class="hint">टैप करें — पटाखे और धमाके की आवाज़ के लिए</div>

<script>
// ---------- शब्द-दर-शब्द रिवील ----------
for (const el of document.querySelectorAll('[data-d]')) {
  const d = parseFloat(el.dataset.d), s = parseFloat(el.dataset.s);
  el.innerHTML = el.textContent.trim().split(/\s+/)
    .map((w, i) => `<span class="w" style="--d:${(d + i * s).toFixed(2)}s">${w}</span>`).join(' ');
}

// ---------- सेटअप ----------
const c = document.getElementById('c'), x = c.getContext('2d');
const D = Math.min(window.devicePixelRatio || 1, 2);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = v => Math.min(1, Math.max(0, v));
let W, H, stars = [], diyas = [], bl = [], embers = [], lanterns = [], txt = [], MID = 0;
let txtY = 0, glowC = document.createElement('canvas');
const rockets = [], parts = [], shocks = [], fire = [];
let flash = 0, shake = 0, ac = null, grand = false, nextBarrage = 10.4;
const t0 = performance.now();
const HUES = [38, 28, 46, 14, 345, 52, 200];
const T_CAM = 6.2, T_WAVE = 6.6, T_TXT = 10.8, T_GRAND = 14.6;

function layout() {
  W = innerWidth; H = innerHeight;
  c.width = W * D; c.height = H * D;
  stars = Array.from({ length: Math.floor(W * H / 5000) }, () => ({ x: rnd(0, W), y: rnd(0, H * .72), r: rnd(.2, 1.3), p: rnd(0, 6.28) }));
  const n = Math.max(5, Math.floor(W / 120)) | 1;
  const gap = W / (n + 1), s = Math.min(1, Math.max(.7, W / 700));
  MID = (n - 1) / 2;
  diyas = Array.from({ length: n }, (_, i) => ({
    x: gap * (i + 1), y: H - H * .07 - 30, s, k: rnd(0, 10), ig: false,
    t0: i === MID ? 3.6 : T_WAVE + Math.abs(i - MID) * .28
  }));
  bl = [];
  for (let px = -10; px < W;) {
    const w = rnd(30, 70), h = rnd(30, 95);
    bl.push({ x: px, w, h, win: Array.from({ length: 4 }, () => ({ dx: rnd(5, w - 8), dy: rnd(6, h - 8), lit: Math.random() })) });
    px += w + rnd(0, 6);
  }
  embers = Array.from({ length: 70 }, () => newEmber(true));
  lanterns = Array.from({ length: Math.max(5, W / 160 | 0) }, () => newLantern(true));
  buildText();
}
const newEmber = init => ({ x: rnd(0, W), y: init ? rnd(H * .3, H) : H + 10, v: rnd(.25, .9), r: rnd(.6, 1.9), p: rnd(0, 6.28), a: rnd(.3, .9) });
const newLantern = init => ({ x: rnd(W * .05, W * .95), y: init ? rnd(H * .35, H * 1.2) : H + 40, v: rnd(.25, .55), s: rnd(.6, 1.2), p: rnd(0, 6.28) });

// ---------- चिंगारियों से बनने वाला टेक्स्ट ----------
function buildText() {
  const word = 'शुभ दीपावली';
  const off = document.createElement('canvas'), o = off.getContext('2d');
  let size = Math.min(H * .24, 300);
  o.font = `${size}px "Rozha One", serif`;
  const wd = o.measureText(word).width;
  if (wd > W * .88) size *= W * .88 / wd;
  txtY = H * .27;
  off.width = Math.max(1, W | 0); off.height = Math.ceil(size * 1.7);
  o.font = `${size}px "Rozha One", serif`; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff';
  o.fillText(word, W / 2, off.height / 2);
  const data = o.getImageData(0, 0, off.width, off.height).data;
  const oy = txtY - off.height / 2;
  let step = Math.max(3, Math.round(size / 26)), pts;
  do {
    pts = [];
    for (let yy = 0; yy < off.height; yy += step)
      for (let xx = 0; xx < off.width; xx += step)
        if (data[((yy * off.width) + xx) * 4 + 3] > 128) pts.push([xx + rnd(0, step * .5), oy + yy + rnd(0, step * .5)]);
    step++;
  } while (pts.length > 2600);

  const done = (performance.now() - t0) / 1000 > T_TXT + 4;
  txt = pts.map(p => {
    const d = diyas[(Math.random() * diyas.length) | 0];
    return {
      x: done ? p[0] : d.x, y: done ? p[1] : d.y - 30, px: d.x, py: d.y,
      tx: p[0], ty: p[1], vx: rnd(-2.5, 2.5), vy: -rnd(3, 9),
      delay: done ? -99 : rnd(0, 2.2), s: rnd(1.6, 2.8), hue: rnd(32, 52), tw: rnd(0, 6.28)
    };
  });
  glowC.width = W; glowC.height = H;
  const g = glowC.getContext('2d');
  g.font = `${size}px "Rozha One", serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(255,140,40,.95)'; g.shadowBlur = 38; g.fillStyle = 'rgba(255,190,90,.5)';
  g.fillText(word, W / 2, txtY);
}

function drawText(t) {
  const age = t - T_TXT;
  if (age < 0 || !txt.length) return;
  x.globalCompositeOperation = 'lighter';
  const form = clamp((age - 1.8) / 2.4);
  if (form > 0) {
    x.save(); x.translate(W / 2, txtY); x.rotate(t * .05);
    x.fillStyle = `rgba(255,170,70,${.05 * form})`;
    const R = Math.hypot(W, H);
    for (let i = 0; i < 20; i++) {
      x.rotate(6.283 / 20);
      x.beginPath(); x.moveTo(0, 0); x.lineTo(R, -R * .05); x.lineTo(R, R * .05); x.fill();
    }
    x.restore();
    x.globalAlpha = Math.min(1, form * (.75 + .25 * Math.sin(t * 2.2)) + flash * .4);
    x.drawImage(glowC, 0, 0, W, H);
    x.globalAlpha = 1;
  }
  for (const p of txt) {
    const a = age - p.delay;
    if (a < 0) continue;
    p.px = p.x; p.py = p.y;
    const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy) || 1;
    const sw = Math.max(0, 1 - a / 2.8) * Math.min(d, 300) * .0015;
    p.vx = (p.vx + dx * .0016 - dy / d * sw) * .955;
    p.vy = (p.vy + dy * .0016 + dx / d * sw) * .955;
    p.x += p.vx; p.y += p.vy;
    const sp = Math.abs(p.vx) + Math.abs(p.vy), tw = .6 + .4 * Math.sin(t * 4 + p.tw);
    if (sp > 1.5) {
      x.strokeStyle = `hsla(${p.hue},100%,72%,.9)`; x.lineWidth = p.s;
      x.beginPath(); x.moveTo(p.px, p.py); x.lineTo(p.x, p.y); x.stroke();
    } else {
      x.fillStyle = `hsla(${p.hue},100%,${62 + 22 * tw}%,${.55 + .45 * tw})`;
      const z = p.s * (1 + flash * .8);
      x.fillRect(p.x - z / 2, p.y - z / 2, z, z);
    }
  }
}

// ---------- आवाज़ ----------
function boom(v = 1) {
  if (!ac) return;
  const n = ac.sampleRate * .9 | 0, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const s = ac.createBufferSource(); s.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 360;
  const g = ac.createGain(); g.gain.value = .55 * v;
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
}

// ---------- दृश्य ----------
function skyline(lit) {
  const base = H - H * .07 - 8, sc = Math.min(1, W / 700), cx = W / 2;
  x.fillStyle = '#06030b';
  for (const b of bl) x.fillRect(b.x, base - b.h, b.w, b.h);
  x.fillRect(cx - 60 * sc, base - 90 * sc, 120 * sc, 90 * sc);
  x.beginPath(); x.arc(cx, base - 90 * sc, 46 * sc, Math.PI, 0); x.fill();
  x.fillRect(cx - 2, base - 162 * sc, 4, 28 * sc);
  x.beginPath(); x.arc(cx, base - 164 * sc, 5 * sc, 0, 6.28); x.fill();
  for (const sx of [-82, 82]) {
    x.fillRect(cx + (sx - 20) * sc, base - 60 * sc, 40 * sc, 60 * sc);
    x.beginPath(); x.arc(cx + sx * sc, base - 60 * sc, 22 * sc, Math.PI, 0); x.fill();
  }
  x.fillStyle = `rgba(255,170,70,${.8 * lit})`;
  for (const b of bl) for (const w of b.win) if (w.lit > .45) x.fillRect(b.x + w.dx, base - b.h + w.dy, 3, 4);
  const g = x.createLinearGradient(0, base, 0, H);
  g.addColorStop(0, '#0d0710'); g.addColorStop(1, '#020106');
  x.fillStyle = g; x.fillRect(-W, base, W * 3, H - base + 600);
}

function diya(d, t) {
  const l = clamp((t - d.t0) / .9), s = d.s;
  x.save(); x.translate(d.x, d.y);
  if (l > 0) {
    const f = .85 + .15 * Math.sin(t * 9 + d.k) + .08 * Math.sin(t * 23 + d.k * 2);
    x.globalCompositeOperation = 'lighter';
    const g = x.createRadialGradient(0, -14 * s, 0, 0, -14 * s, 180 * s * l);
    g.addColorStop(0, `rgba(255,150,50,${.42 * f * l})`); g.addColorStop(1, 'rgba(255,90,20,0)');
    x.fillStyle = g; x.fillRect(-200 * s, -200 * s, 400 * s, 400 * s);
    x.globalCompositeOperation = 'source-over';
  }
  x.beginPath();
  x.moveTo(-26 * s, -6 * s);
  x.quadraticCurveTo(-22 * s, 16 * s, 0, 16 * s);
  x.quadraticCurveTo(22 * s, 16 * s, 26 * s, -6 * s);
  x.quadraticCurveTo(0, 0, -26 * s, -6 * s);
  const b = x.createLinearGradient(0, -6 * s, 0, 16 * s);
  b.addColorStop(0, '#c0551f'); b.addColorStop(1, '#4a1a0a');
  x.fillStyle = b; x.fill();
  if (l > 0) {
    x.fillStyle = `rgba(255,190,90,${.55 * l})`;
    x.beginPath(); x.ellipse(0, -6 * s, 22 * s, 3 * s, 0, 0, 6.28); x.fill();
    const h = (22 + 4 * Math.sin(t * 11 + d.k)) * s * l, sw = Math.sin(t * 7 + d.k) * 2 * s;
    x.globalCompositeOperation = 'lighter';
    x.beginPath();
    x.moveTo(0, -6 * s);
    x.quadraticCurveTo(-8 * s, -6 * s - h * .35, sw * .5, -6 * s - h);
    x.quadraticCurveTo(8 * s, -6 * s - h * .35, 0, -6 * s);
    const fg = x.createLinearGradient(0, -6 * s, 0, -6 * s - h);
    fg.addColorStop(0, '#fff6d0'); fg.addColorStop(.4, '#ffb43c'); fg.addColorStop(1, 'rgba(255,80,10,0)');
    x.fillStyle = fg; x.fill();
  }
  x.restore();
}

// असली आग: पार्टिकल वाली लौ
function emitFire(d, l, isMid) {
  let n = (isMid ? 5 : 2) * l;
  while (n > 0) {
    if (Math.random() < Math.min(1, n)) {
      const s = d.s;
      if (Math.random() < .12) fire.push({ x: d.x + rnd(-3, 3) * s, y: d.y - 14 * s, vx: rnd(-.6, .6), vy: -rnd(1, 2.6) * s, dec: .007, r: 1.3 * s, life: 1, e: true, s, k: rnd(0, 6) });
      else fire.push({ x: d.x + rnd(-3, 3) * s, y: d.y - 8 * s, vx: rnd(-.25, .25) * s, vy: -rnd(.5, 1.5) * s, dec: rnd(.025, .05), r: rnd(3, 6) * s, life: 1, e: false, s, k: rnd(0, 6) });
    }
    n--;
  }
}
function fireStep() {
  if (fire.length > 3000) fire.splice(0, fire.length - 3000);
  for (let i = fire.length - 1; i >= 0; i--) {
    const f = fire[i];
    f.x += f.vx + Math.sin(f.life * 9 + f.k) * .12 * f.s; f.y += f.vy; f.life -= f.dec; f.r *= .988;
    if (f.life <= 0) { fire.splice(i, 1); continue; }
    const L = f.life;
    x.fillStyle = f.e ? `rgba(255,170,70,${L * .9})`
      : L > .66 ? `rgba(255,235,170,${L * .9})`
      : L > .33 ? `rgba(255,150,40,${L * .8})` : `rgba(210,60,20,${L * .6})`;
    x.beginPath(); x.arc(f.x, f.y, f.r * (.4 + L * .6), 0, 6.28); x.fill();
  }
}
function ignite(d) {
  for (let i = 0; i < 34; i++)
    parts.push({ x: d.x, y: d.y - 14 * d.s, px: d.x, py: d.y - 14 * d.s, vx: rnd(-2.2, 2.2), vy: -rnd(1, 4.5), life: .9, dec: .03, hue: rnd(34, 50), g: .06, f: .97, c: false });
}

function lantern(l, t) {
  const a = clamp((t - 9) / 3), fl = .85 + .15 * Math.sin(t * 6 + l.p);
  x.save(); x.translate(l.x + Math.sin(t * .6 + l.p) * 18, l.y); x.scale(l.s, l.s);
  const g = x.createRadialGradient(0, 0, 0, 0, 0, 55);
  g.addColorStop(0, `rgba(255,150,50,${.45 * fl * a})`); g.addColorStop(1, 'rgba(255,90,20,0)');
  x.fillStyle = g; x.fillRect(-60, -60, 120, 120);
  const b = x.createLinearGradient(0, -16, 0, 16);
  b.addColorStop(0, `rgba(255,205,110,${.95 * a})`); b.addColorStop(1, `rgba(220,90,20,${.9 * a})`);
  x.fillStyle = b;
  x.beginPath(); x.moveTo(-10, -16); x.lineTo(10, -16); x.lineTo(14, 14); x.lineTo(-14, 14); x.closePath(); x.fill();
  x.restore();
}

// ---------- आतिशबाज़ी ----------
function launch(tx, ty, big) {
  const sx = tx ?? rnd(W * .12, W * .88);
  rockets.push({ x: sx, y: H - H * .08, tx: sx + rnd(-30, 30), ty: ty ?? rnd(H * .1, H * .42), sp: rnd(8, 12), big });
}
function explode(r) {
  const type = ['peony', 'ring', 'willow', 'crackle', 'double'][(Math.random() * 5) | 0];
  const hue = HUES[(Math.random() * HUES.length) | 0];
  const n = r.big ? 170 : (rnd(80, 120) | 0);
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28);
    const p = { x: r.x, y: r.y, px: r.x, py: r.y, life: 1, hue: hue + rnd(-8, 8), g: .05, f: .985, c: false, dec: rnd(.008, .016) };
    let sp = rnd(1, 5.2) * (r.big ? 1.25 : 1);
    if (type === 'ring') sp = r.big ? 5.4 : 4.3;
    if (type === 'willow') { sp = rnd(1, 4); p.dec = rnd(.004, .007); p.g = .03; p.f = .99; p.hue = 42; }
    if (type === 'crackle') { p.c = true; p.dec = rnd(.01, .018); }
    if (type === 'double' && i % 2) { sp *= .45; p.hue = hue + 150; }
    p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
    parts.push(p);
  }
  shocks.push({ x: r.x, y: r.y, r: 4, a: r.big ? .8 : .45 });
  flash = Math.min(.5, flash + (r.big ? .4 : .22));
  shake = Math.min(14, shake + (r.big ? 9 : 3));
  boom(r.big ? 1 : .6);
}
function barrage(n, big) {
  for (let i = 0; i < n; i++)
    setTimeout(() => launch(W * (.08 + .84 * i / (n - 1)), rnd(H * .08, H * .38), big && i % 3 === 1), i * 190);
}

// ---------- मुख्य लूप ----------
function frame(now) {
  const t = (now - t0) / 1000, lit = clamp((t - T_WAVE) / 3);
  shake *= .9;
  const shx = (Math.random() - .5) * shake, shy = (Math.random() - .5) * shake;
  const setT = (z, ox, oy) => x.setTransform(D * z, 0, 0, D * z, D * (ox + shx), D * (oy + shy));

  // --- आसमान (स्क्रीन स्पेस) ---
  setT(1, 0, 0);
  x.globalCompositeOperation = 'source-over';
  const bg = x.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#03010a'); bg.addColorStop(.6, '#0c0614'); bg.addColorStop(1, '#2a100e');
  x.fillStyle = bg; x.fillRect(-20, -20, W + 40, H + 40);
  for (const s of stars) {
    x.fillStyle = `rgba(255,236,210,${.25 + .45 * Math.abs(Math.sin(t * .8 + s.p))})`;
    x.fillRect(s.x, s.y, s.r, s.r);
  }
  x.globalCompositeOperation = 'lighter';
  const hg = x.createRadialGradient(W / 2, H - 40, 0, W / 2, H - 40, W * .75);
  hg.addColorStop(0, `rgba(255,120,30,${.24 * lit})`); hg.addColorStop(1, 'rgba(255,80,20,0)');
  x.fillStyle = hg; x.fillRect(0, 0, W, H);
  if (flash > .01) { x.fillStyle = `rgba(255,175,95,${flash * .2})`; x.fillRect(0, 0, W, H); flash *= .9; }
  x.globalCompositeOperation = 'source-over';

  // --- कैमरा: बड़े दीये से पीछे हटता हुआ ---
  const k = clamp((t - T_CAM) / 4.2), e = k * k * (3 - 2 * k), z = Math.pow(3.4, 1 - e);
  const m = diyas[MID], my = m.y - 20;
  const fx = m.x + (W / 2 - m.x) * e, fy = my + (H / 2 - my) * e;
  setT(z, W / 2 - fx * z, H / 2 - fy * z);

  skyline(lit);

  x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < lanterns.length; i++) {
    const l = lanterns[i]; l.y -= l.v;
    if (l.y < -60) lanterns[i] = newLantern(false);
    if (t > 9) lantern(l, t);
  }

  // आतिशबाज़ी का शेड्यूल
  if (t > nextBarrage) { barrage(grand ? 9 : 5, grand); nextBarrage += grand ? 13 : 99; }
  if (t > T_TXT - .4 && !grand && t < T_GRAND && Math.random() < .012) launch();
  if (grand && Math.random() < .03) launch();
  if (!grand && t > T_GRAND) {
    grand = true; nextBarrage = t + 14;
    barrage(14, true); launch(W / 2, H * .2, true);
    flash = 1; shake = 16;
    for (let i = 0; i < 3; i++) shocks.push({ x: W / 2, y: txtY, r: 4 - i * 40, a: .9 });
    boom(1.2);
  }

  x.globalCompositeOperation = 'lighter';
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i], dx = r.tx - r.x, dy = r.ty - r.y, d = Math.hypot(dx, dy);
    if (d < r.sp) { explode(r); rockets.splice(i, 1); continue; }
    const px = r.x, py = r.y;
    r.x += dx / d * r.sp; r.y += dy / d * r.sp;
    x.strokeStyle = 'rgba(255,225,170,.95)'; x.lineWidth = 2.2;
    x.beginPath(); x.moveTo(px - dx / d * 10, py - dy / d * 10); x.lineTo(r.x, r.y); x.stroke();
  }
  for (let i = shocks.length - 1; i >= 0; i--) {
    const s = shocks[i]; s.r += 7; s.a *= .92;
    if (s.a < .02) { shocks.splice(i, 1); continue; }
    if (s.r < 0) continue;
    x.strokeStyle = `rgba(255,200,130,${s.a})`; x.lineWidth = 2;
    x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.28); x.stroke();
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.px = p.x; p.py = p.y;
    p.vx *= p.f; p.vy = p.vy * p.f + p.g;
    p.x += p.vx; p.y += p.vy; p.life -= p.dec;
    if (p.life <= 0) {
      if (p.c && Math.random() < .5) for (let q = 0; q < 3; q++)
        parts.push({ x: p.x, y: p.y, px: p.x, py: p.y, vx: rnd(-1.5, 1.5), vy: rnd(-1.5, 1.5), life: .6, dec: .06, hue: 50, g: .02, f: .95, c: false });
      parts.splice(i, 1); continue;
    }
    x.strokeStyle = `hsla(${p.hue},100%,${55 + 25 * p.life}%,${p.life})`;
    x.lineWidth = 1.7 * p.life + .4;
    x.beginPath(); x.moveTo(p.px, p.py); x.lineTo(p.x, p.y); x.stroke();
  }

  // दीये + आग की लहर
  x.globalCompositeOperation = 'source-over';
  for (let i = 0; i < diyas.length; i++) {
    const d = diyas[i];
    if (!d.ig && t >= d.t0) { d.ig = true; ignite(d); }
    diya(d, t);
    const l = clamp((t - d.t0) / .9);
    if (l > 0) { x.globalCompositeOperation = 'lighter'; emitFire(d, l, i === MID); x.globalCompositeOperation = 'source-over'; }
  }
  x.globalCompositeOperation = 'lighter';
  fireStep();

  for (let i = 0; i < embers.length; i++) {
    const em = embers[i];
    em.y -= em.v; em.x += Math.sin(t + em.p) * .3;
    if (em.y < -10) embers[i] = newEmber(false);
    x.fillStyle = `rgba(255,${150 + 60 * Math.sin(t * 3 + em.p) | 0},60,${em.a * lit * (.5 + .5 * Math.sin(t * 4 + em.p))})`;
    x.beginPath(); x.arc(em.x, em.y, em.r, 0, 6.28); x.fill();
  }

  // --- चिंगारियों से बना "शुभ दीपावली" (स्क्रीन स्पेस) ---
  setT(1, 0, 0);
  drawText(t);
  x.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}

addEventListener('pointerdown', ev => {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  if ((performance.now() - t0) / 1000 > 10.6) launch(ev.clientX, ev.clientY, false);
});
addEventListener('resize', layout);
layout();
if (document.fonts && document.fonts.load)
  document.fonts.load('100px "Rozha One"', 'शुभ दीपावली').then(() => { if ((performance.now() - t0) / 1000 < T_TXT) buildText(); }).catch(() => {});
requestAnimationFrame(frame);
</script>
</body>
</html>
